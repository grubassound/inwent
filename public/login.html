<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rack Inventory</title>
<script src="i18n.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-top">
  <select id="langSel" class="compact" data-i18n-aria="lang.label" data-i18n-title="lang.label"></select>
  <button class="btn icon" id="themeBtn" type="button"></button>
</div>
<main class="login card">
  <img src="favicon.svg" alt="">
  <div class="eyebrow" data-i18n="login.eyebrow">Szafa sieciowa</div>
  <h1 data-i18n="app.title">Inwentaryzacja racka</h1>
  <p class="login-sub" data-i18n="login.sub">Zaloguj się, żeby zobaczyć i edytować porty.</p>
  <div id="msg" class="login-msg" role="alert" hidden></div>
  <form class="form" method="post" action="login">
    <div class="field"><label for="user" data-i18n="login.user">Login</label>
      <input id="user" name="user" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></div>
    <div class="field"><label for="password" data-i18n="login.pass">Hasło</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required></div>
    <label class="check"><input name="remember" type="checkbox" value="1"> <span data-i18n="login.remember">Zapamiętaj mnie na tym urządzeniu (30 dni)</span></label>
    <button class="btn primary login-btn" type="submit" data-i18n="login.submit">Zaloguj się</button>
  </form>
</main>
<script>
(() => {
  const { t } = window.i18n;
  const q = new URLSearchParams(location.search);
  const msg = document.getElementById('msg');
  const key = q.get('blad') === 'limit' ? 'login.limit' : q.get('blad') ? 'login.bad'
    : q.get('sesja') ? 'login.expired' : q.get('wylogowano') ? 'login.out' : null;
  const show = () => {
    document.title = t('login.title') + ' · ' + t('app.title');
    if (!key) return;
    msg.textContent = t(key); msg.hidden = false; msg.classList.toggle('ok', key === 'login.out');
  };
  window.i18n.apply();
  window.i18n.bindLangSelect(document.getElementById('langSel'));
  window.i18n.bindThemeButton(document.getElementById('themeBtn'));
  document.addEventListener('langchange', show);
  show();
  if (q.has('blad')) document.getElementById('password').focus();
  if (location.search) history.replaceState(null, '', location.pathname);
})();
</script>
</body>
</html>
