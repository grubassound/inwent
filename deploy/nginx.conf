# Przykładowy vhost nginx jako reverse proxy przed aplikacją.
# Skopiuj do /etc/nginx/sites-available/rack-inventory, zmień server_name,
# zrób dowiązanie do sites-enabled i przeładuj: sudo nginx -t && sudo systemctl reload nginx
#
# Przy włączonym logowaniu (AUTH_USER/AUTH_PASSWORD) używaj HTTPS: HTTP Basic przez zwykłe HTTP
# wysyła hasło otwartym tekstem. Z publiczną domeną najprościej: sudo certbot --nginx -d rack.twojadomena.pl
# (certbot sam dopisze sekcję 443 i przekierowanie). Bez domeny, w LAN, użyj bloku HTTPS niżej
# z certyfikatem self-signed albo z wewnętrznego CA.
server {
    listen 80;
    server_name rack.twojadomena.pl;   # albo IP serwera w LAN

    client_max_body_size 10m;          # import kopii JSON

    location / {
        proxy_pass         http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# HTTPS w LAN z własnym certyfikatem. Certyfikat self-signed na 5 lat:
#   sudo openssl req -x509 -newkey rsa:2048 -nodes -days 1825 -subj "/CN=rack.lan" \
#     -keyout /etc/ssl/private/rack.key -out /etc/ssl/certs/rack.crt
# Potem w bloku `listen 80` powyżej zamień `location / {…}` na:  return 301 https://$host$request_uri;
#
# server {
#     listen 443 ssl;
#     server_name rack.twojadomena.pl;
#     ssl_certificate     /etc/ssl/certs/rack.crt;
#     ssl_certificate_key /etc/ssl/private/rack.key;
