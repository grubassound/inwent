# Przykładowy vhost nginx jako reverse proxy przed aplikacją.
# Skopiuj do /etc/nginx/sites-available/rack-inventory, zmień server_name,
# zrób dowiązanie do sites-enabled i przeładuj: sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    server_name rack.twojadomena.pl;   # albo IP serwera w LAN

    client_max_body_size 10m;          # import kopii JSON

    location / {
        proxy_pass         http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

