# Apache jako serwer WWW przed aplikacją (reverse proxy do Node.js na 127.0.0.1:3080).
#
# Wymagane moduły (jednorazowo):
#   sudo a2enmod proxy proxy_http headers
#
# WARIANT A: osobna nazwa, np. http://rack.firma.lan albo https://rack.twojadomena.pl
#   sudo cp deploy/apache.conf /etc/apache2/sites-available/rack-inventory.conf
#   sudo nano /etc/apache2/sites-available/rack-inventory.conf     # ustaw ServerName
#   sudo a2ensite rack-inventory
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# WARIANT B: podkatalog istniejącej strony, np. http://serwer/rack/ (patrz niżej, na końcu pliku).

<VirtualHost *:80>
    ServerName rack.twojadomena.pl
    # ServerAlias 192.168.1.10

    # Apache niczego tu nie serwuje z dysku, wszystko idzie do Node.js.
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:3080/ timeout=60
    ProxyPassReverse / http://127.0.0.1:3080/
    # X-Forwarded-For Apache dodaje sam; aplikacja ufa mu tylko z 127.0.0.1.
    RequestHeader set X-Forwarded-Proto "http"

    # Import kopii JSON: do 10 MB.
    LimitRequestBody 10485760

    ErrorLog  ${APACHE_LOG_DIR}/rack-inventory-error.log
    CustomLog ${APACHE_LOG_DIR}/rack-inventory-access.log combined
</VirtualHost>

# HTTPS
# -----
# Publiczna domena: sudo apt install certbot python3-certbot-apache && sudo certbot --apache -d rack.twojadomena.pl
# Certbot sam utworzy wersję :443 tego bloku i przekierowanie z HTTP.
#
# Tylko LAN (bez domeny): certyfikat self-signed, przeglądarka raz zapyta o wyjątek.
#   sudo a2enmod ssl
#   sudo openssl req -x509 -newkey rsa:2048 -nodes -days 1825 -subj "/CN=rack.lan" \
#     -keyout /etc/ssl/private/rack.key -out /etc/ssl/certs/rack.crt
# Potem odkomentuj blok niżej, a w bloku :80 zamień linie Proxy* na:
#   Redirect permanent / https://rack.twojadomena.pl/
#
# <VirtualHost *:443>
#     ServerName rack.twojadomena.pl
#     SSLEngine on
#     SSLCertificateFile    /etc/ssl/certs/rack.crt
#     SSLCertificateKeyFile /etc/ssl/private/rack.key
#
#     ProxyPreserveHost On
#     ProxyPass        / http://127.0.0.1:3080/ timeout=60
#     ProxyPassReverse / http://127.0.0.1:3080/
#     RequestHeader set X-Forwarded-Proto "https"
#     LimitRequestBody 10485760
#
#     ErrorLog  ${APACHE_LOG_DIR}/rack-inventory-error.log
#     CustomLog ${APACHE_LOG_DIR}/rack-inventory-access.log combined
# </VirtualHost>

# WARIANT B: podkatalog /rack/ w stronie, która już działa na tym Apache
# ---------------------------------------------------------------------
# Wklej poniższe linie do istniejącego <VirtualHost> (np. /etc/apache2/sites-available/000-default.conf
# albo default-ssl.conf), przed </VirtualHost>, i przeładuj Apache. Reszta strony (np. PHP) działa jak dotąd.
#
#     RedirectMatch 301 ^/rack$ /rack/
#     <Location /rack/>
#         ProxyPass        http://127.0.0.1:3080/ timeout=60
#         ProxyPassReverse http://127.0.0.1:3080/
#         LimitRequestBody 10485760
#     </Location>
